<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="1540" version="1.1" viewBox="0 0 1440 1540" width="1440" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#07131e" height="1540" width="1440" x="0" y="0" /><text fill="#74d9de" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" x="48" y="55">SIDEFX / THE VISUAL ALPHABET</text><text fill="#f2f0e9" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="700" text-anchor="start" x="48" y="116">Learn it once. Read every capability.</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" x="48" y="161">Shape carries meaning. Color reinforces it. Evidence status stays separate.</text><rect fill="#0b1e2c" height="222" rx="12" stroke="#354c60" width="430" x="48" y="213" /><rect fill="#0e2333" height="84" rx="15" stroke="#75baff" stroke-width="2.2" width="128" x="68" y="237" /><text fill="#75baff" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" x="217" y="261">Input</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="217" y="296">Admitted incoming product,</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="217" y="320">data, or state. Name the</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="217" y="344">admission scope; receipt is</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="217" y="368">required to claim observed</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="217" y="392">admission.</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="68" y="402">rounded-rectangle</text><rect fill="#0b1e2c" height="222" rx="12" stroke="#354c60" width="430" x="518" y="213" /><polygon fill="#0e2333" points="557,237 647,237 666,256 666,302 647,321 557,321 538,302 538,256" stroke="#4eddeb" stroke-width="2.2" /><text fill="#4eddeb" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" x="687" y="261">Event</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="687" y="296">Execution or exercise of a</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="687" y="320">responsibility.</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="538" y="402">beveled-rectangle</text><rect fill="#0b1e2c" height="222" rx="12" stroke="#354c60" width="430" x="988" y="213" /><rect fill="#0e2333" height="84" rx="42.0" stroke="#72e1ad" stroke-width="2.2" width="128" x="1008" y="237" /><text fill="#72e1ad" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" x="1157" y="261">Outcome</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="1157" y="296">Resulting product, experience,</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="1157" y="320">or disposition. Completion is</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="1157" y="344">not implied by shape alone.</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="1008" y="402">capsule</text><rect fill="#0b1e2c" height="222" rx="12" stroke="#354c60" width="430" x="48" y="463" /><path d="M94 487 H196 V571 H94 V544.12 H68 V513.88 H94 Z" fill="#0e2333" stroke="#82a8f9" stroke-width="2.2" /><line stroke="#82a8f9" stroke-width="3" x1="76" x2="92" y1="523.12" y2="523.12" /><line stroke="#82a8f9" stroke-width="3" x1="76" x2="92" y1="534.88" y2="534.88" /><text fill="#82a8f9" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" x="217" y="511">Provider port</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="217" y="546">Required responsibility</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="217" y="570">boundary; distinct from its</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="217" y="594">fulfiller.</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="68" y="652">socket</text><rect fill="#0b1e2c" height="222" rx="12" stroke="#354c60" width="430" x="518" y="463" /><path d="M538 501 H562 V487 H656 V501 H666 V571 H538 Z" fill="#0e2333" stroke="#b397ed" stroke-width="2.2" /><rect fill="#b397ed" height="34" width="5" x="650" y="517" /><text fill="#b397ed" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" x="687" y="511">Provider</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="687" y="546">Fulfiller attached to one or</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="687" y="570">more ports. Binding and</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="687" y="594">operating state are separate.</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="538" y="652">tabbed-tile</text><rect fill="#0b1e2c" height="222" rx="12" stroke="#354c60" width="430" x="988" y="463" /><path d="M1008 487 H1136 V541 Q1072.0 585 1008 541 Z" fill="#0e2333" stroke="#67d7bb" stroke-width="2.2" /><polyline fill="none" points="1088,514 1096,522 1110,507" stroke="#67d7bb" stroke-width="3" /><text fill="#67d7bb" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" x="1157" y="511">Validation</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="1157" y="546">Named conformance or</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="1157" y="570">admission criteria; a check</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="1157" y="594">glyph does not assert a passed</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="1157" y="618">run.</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="1008" y="652">shield-check</text><rect fill="#0b1e2c" height="222" rx="12" stroke="#354c60" width="430" x="48" y="713" /><rect fill="#0e2333" height="84" rx="4" stroke="#d7ecf6" stroke-width="2.2" width="116" x="80" y="727" /><rect fill="#0e2333" height="84" rx="4" stroke="#d7ecf6" stroke-width="2.2" width="122" x="74" y="732" /><rect fill="#0e2333" height="84" rx="4" stroke="#d7ecf6" stroke-width="2.2" width="128" x="68" y="737" /><line stroke="#d7ecf6" stroke-width="2" x1="144" x2="174" y1="758" y2="758" /><line stroke="#d7ecf6" stroke-width="2" x1="144" x2="174" y1="765" y2="765" /><line stroke="#d7ecf6" stroke-width="2" x1="144" x2="174" y1="772" y2="772" /><text fill="#d7ecf6" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" x="217" y="761">Evidence</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="217" y="796">Source declaration,</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="217" y="820">expectation, observation, or</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="217" y="844">required proof; always identify</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="217" y="868">which.</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="68" y="902">document-stack</text><rect fill="#0b1e2c" height="222" rx="12" stroke="#354c60" width="430" x="518" y="713" /><rect fill="#0e2333" height="84" rx="5" stroke="#f2c472" stroke-width="2.2" width="128" x="538" y="737" /><circle cx="634" cy="765" fill="none" r="9" stroke="#f2c472" stroke-width="2" /><path d="M620 790 Q634 769 648 790" fill="none" stroke="#f2c472" stroke-width="2" /><text fill="#f2c472" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" x="687" y="761">Human approval</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="687" y="796">Separately authenticated</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="687" y="820">human decision boundary; no</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="687" y="844">agent self-approval.</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="538" y="902">person-in-gate</text><rect fill="#0b1e2c" height="222" rx="12" stroke="#354c60" width="430" x="988" y="713" /><rect fill="#0e2333" height="84" rx="6" stroke="#f6e6b6" stroke-width="2.2" width="128" x="1008" y="737" /><rect fill="#f6e6b6" height="12" width="128" x="1008" y="737" /><line stroke="#f6e6b6" stroke-width="2" x1="1017" x2="1017" y1="755" y2="812" /><text fill="#f6e6b6" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" x="1157" y="761">Policy / authority</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="1157" y="796">The governing semantic</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="1157" y="820">authority for a named</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="1157" y="844">operation and scope.</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="1008" y="902">top-band-frame</text><rect fill="#0b1e2c" height="222" rx="12" stroke="#354c60" width="430" x="48" y="963" /><line stroke="#83cfd5" stroke-width="4" x1="78" x2="122.0" y1="1029.0" y2="1029.0" /><line stroke="#83cfd5" stroke-width="4" x1="122.0" x2="186" y1="1029.0" y2="997.0" /><line stroke="#83cfd5" stroke-width="4" x1="122.0" x2="186" y1="1029.0" y2="1061.0" /><text fill="#83cfd5" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" x="217" y="1011">Branch</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="217" y="1046">One path chooses exactly one</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="217" y="1070">guarded route; includes an</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="217" y="1094">explicit otherwise path.</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="68" y="1152">fork</text><rect fill="#0b1e2c" height="222" rx="12" stroke="#354c60" width="430" x="518" y="963" /><circle cx="602.0" cy="1029.0" fill="#0e2333" r="20" stroke="#83cfd5" stroke-width="3" /><line stroke="#83cfd5" stroke-width="3" x1="548.0" x2="602.0" y1="1029.0" y2="1029.0" /><line stroke="#83cfd5" stroke-width="3" x1="602.0" x2="654.0" y1="1029.0" y2="998.0" /><line stroke="#83cfd5" stroke-width="3" x1="602.0" x2="654.0" y1="1029.0" y2="1060.0" /><text fill="#83cfd5" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" x="687" y="1011">Fan-out</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="687" y="1046">One product feeds every</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="687" y="1070">declared outgoing dependent;</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="687" y="1094">concurrency is a separate</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="687" y="1118">claim.</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="538" y="1152">radial-hub</text><rect fill="#0b1e2c" height="222" rx="12" stroke="#354c60" width="430" x="988" y="963" /><line stroke="#83cfd5" stroke-width="4" x1="1018" x2="1082.0" y1="997.0" y2="1029.0" /><line stroke="#83cfd5" stroke-width="4" x1="1018" x2="1082.0" y1="1061.0" y2="1029.0" /><line stroke="#83cfd5" stroke-width="4" x1="1082.0" x2="1126" y1="1029.0" y2="1029.0" /><text fill="#83cfd5" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" x="1157" y="1011">Convergence</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="1157" y="1046">Many arrivals form one</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="1157" y="1070">continuation under a declared</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="1157" y="1094">all, any, or quorum policy.</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="1008" y="1152">merge</text><rect fill="#0b1e2c" height="222" rx="12" stroke="#354c60" width="430" x="48" y="1213" /><polygon fill="#0e2333" points="132.0,1237 196,1279.0 132.0,1321 68,1279.0" stroke="#83cfd5" stroke-width="2.2" /><text fill="#83cfd5" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" x="217" y="1261">Decision / selection</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="217" y="1296">Compare alternatives and</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="217" y="1320">select one under a named</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="217" y="1344">rule. A displayed alternative is</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="217" y="1368">not an executed route.</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="68" y="1402">diamond</text><rect fill="#0b1e2c" height="222" rx="12" stroke="#354c60" width="430" x="518" y="1213" /><circle cx="602.0" cy="1279.0" fill="#d7ecf6" r="25.2" /><line stroke="#d7ecf6" stroke-width="7" x1="573.84" x2="573.84" y1="1258.0" y2="1300.0" /><text fill="#d7ecf6" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" x="687" y="1261">Termination</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="687" y="1296">This route has ended; no</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="687" y="1320">outgoing control or product</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="687" y="1344">edge.</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="538" y="1402">solid-end-cap</text><rect fill="#0b1e2c" height="222" rx="12" stroke="#354c60" width="430" x="988" y="1213" /><polygon fill="#0e2333" points="1030,1237 1114,1237 1136,1259 1136,1299 1114,1321 1030,1321 1008,1299 1008,1259" stroke="#efa585" stroke-width="2.2" /><line stroke="#efa585" stroke-width="5" x1="1081" x2="1113" y1="1262" y2="1262" /><text fill="#efa585" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" x="1157" y="1261">Rejection / hold</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="1157" y="1296">Stop the requested effect;</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="1157" y="1320">retain its exact DENY, HOLD,</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="1157" y="1344">or rejected disposition and</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" x="1157" y="1368">reason.</text><text fill="#abbcca" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="1008" y="1402">barred-octagon</text></svg>