<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>A confirmed reservation</title><desc>Illustrative teaching plate based on fictional case A-W1. This is not an execution trace.</desc><rect width="1920" height="1080" fill="#091016"/><defs><linearGradient id="line"><stop stop-color="#7cddd8"/><stop offset="1" stop-color="#ac98ff"/></linearGradient></defs><rect x="100" y="107" width="62" height="5" fill="url(#line)"/><text x="100" y="77.0" font-family="Segoe UI" font-size="30" font-weight="700" fill="#f3f7f8">SideFX</text><text x="1370" y="77.0" font-family="Segoe UI" font-size="25" font-weight="400" fill="#b3c1ca">02 / CONSEQUENCES</text><text x="100" y="175.0" font-family="Segoe UI" font-size="29" font-weight="700" fill="#7cddd8">A FICTIONAL WEEKEND OUTING</text><text x="100" y="302.0" font-family="Segoe UI" font-size="79" font-weight="700" fill="#f3f7f8">The room is booked.</text><rect x="100.0" y="495" width="846.0" height="393" rx="10" fill="#121e28" stroke="#2c3c49"/><rect x="100.0" y="495" width="846.0" height="4" fill="#7cddd8"/><text x="130.0" y="553.0" font-family="Segoe UI" font-size="25" font-weight="700" fill="#7cddd8">COMPLETED</text><text x="130.0" y="628.0" font-family="Segoe UI" font-size="39" font-weight="400" fill="#f3f7f8">Room reservation confirmed.</text><rect x="974.0" y="495" width="846.0" height="393" rx="10" fill="#121e28" stroke="#2c3c49"/><rect x="974.0" y="495" width="846.0" height="4" fill="#f5c779"/><text x="1004.0" y="553.0" font-family="Segoe UI" font-size="25" font-weight="700" fill="#f5c779">REPORTED</text><text x="1004.0" y="628.0" font-family="Segoe UI" font-size="39" font-weight="400" fill="#f3f7f8">Two members cannot attend: the time</text><text x="1004.0" y="677.5" font-family="Segoe UI" font-size="39" font-weight="400" fill="#f3f7f8">conflicts with their last bus home.</text><path d="M100 963 H1820" stroke="#2c3c49"/><path d="M100 963 H364.6" stroke="#7cddd8" stroke-width="3"/><tex