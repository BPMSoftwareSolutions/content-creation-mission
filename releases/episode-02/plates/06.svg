<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>Separate action, result, and uncertainty</title><desc>Illustrative teaching plate based on fictional case A-W1. This is not an execution trace.</desc><rect width="1920" height="1080" fill="#091016"/><defs><linearGradient id="line"><stop stop-color="#7cddd8"/><stop offset="1" stop-color="#ac98ff"/></linearGradient></defs><rect x="100" y="107" width="62" height="5" fill="url(#line)"/><text x="100" y="77.0" font-family="Segoe UI" font-size="30" font-weight="700" fill="#f3f7f8">SideFX</text><text x="1370" y="77.0" font-family="Segoe UI" font-size="25" font-weight="400" fill="#b3c1ca">02 / CONSEQUENCES</text><text x="100" y="175.0" font-family="Segoe UI" font-size="29" font-weight="700" fill="#7cddd8">A DECISION PLATE</text><text x="100" y="302.0" font-family="Segoe UI" font-size="79" font-weight="700" fill="#f3f7f8">Is the outing arranged for</text><text x="100" y="393.6" font-family="Segoe UI" font-size="79" font-weight="700" fill="#f3f7f8">the people who need it?</text><rect x="100.0" y="495" width="554.6666666666666" height="393" rx="10" fill="#121e28" stroke="#2c3c49"/><rect x="100.0" y="495" width="554.6666666666666" height="4" fill="#7cddd8"/><text x="130.0" y="553.0" font-family="Segoe UI" font-size="25" font-weight="700" fill="#7cddd8">WHAT HAPPENED</text><text x="130.0" y="628.0" font-family="Segoe UI" font-size="39" font-weight="400" fill="#f3f7f8">A room reservation was</text><text x="130.0" y="677.5" font-family="Segoe UI" font-size="39" font-weight="400" fill="#f3f7f8">confirmed.</text><rect x="682.6666666666666" y="495" width="554.6666666666666" height="393" rx="10" fill="#121e28" stroke="#2c3c49"/><rect x="682.6666666666666" y="495" width="554.6666666666666" height="4" fill="#f3f7f8"/><text x="712.6666666666666" y="553.0" font-family="Segoe UI" font-size="25" font-weight="700" fill="#f3f7f8">WHAT PEOPLE NEED</text><text x="712.6666666666666" y="628.0" font-family="Segoe UI" font-size="39" font-weight="400" fill="#f3f7f8">An outing the intended</text><text x="712.6666666666666" y="677.5" font-family="Segoe UI" font-size="39" font-weight="400" fill="#f3f7f8">participants can actually</text><text x="712.6666666666666" y="727.1" font-family="Segoe UI" font-size="39" font-weight="400" fill="#f3f7f8">attend.</text><rect x="1265.3333333333333" y="495" width="554.6666666666666" height="393" rx="10" fill="#121e28" stroke="#2c3c49"/><rect x="1265.3333333333333" y="495" width="554.6666666666666" height="4" fill="#f5c779"/><text x="1295.3333333333333" y="553.0" font-family="Segoe UI" font-size="25" font-weight="700" fill="#f5c779">WHAT REMAINS OPEN</text><text x="1295.3333333333333" y="628.0" font-family="Segoe UI" font-size="39" font-weight="400" fill="#f3f7f8">Two report a travel conflict.</text><text x="1295.3333333333333" y="677.5" font-family="Segoe UI" font-size="39" font-weight="400" fill="#f3f7f8">Other times and costs are</text><text x="1295.3333333333333" y="727.1" font-family="Segoe UI" font-size="39" font-weight="400" fill="#f3f7f8">unknown.</text><path d="M100 963 H1820" stroke="#2c3c49"/><path d="M100 963 H893.8" stroke="#7cddd8" stroke-width="3"/><text x="100" y="1019.0" font-family="Segoe UI" font-size="23" font-weight="400" fill="#b3c1ca">ILLUSTRATIVE · FICTIONAL CASE A-W1</text><text x="1650" y="1019.0" font-family="Segoe UI" font-size="23" font-weight="400" fill="#b3c1ca">06 / 13</text></svg>