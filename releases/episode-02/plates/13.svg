<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>Carry the question with you</title><desc>Illustrative teaching plate based on fictional case A-W1. This is not an execution trace.</desc><rect width="1920" height="1080" fill="#091016"/><defs><linearGradient id="line"><stop stop-color="#7cddd8"/><stop offset="1" stop-color="#ac98ff"/></linearGradient></defs><rect x="100" y="107" width="62" height="5" fill="url(#line)"/><text x="100" y="77.0" font-family="Segoe UI" font-size="30" font-weight="700" fill="#f3f7f8">SideFX</text><text x="1370" y="77.0" font-family="Segoe UI" font-size="25" font-weight="400" fill="#b3c1ca">02 / CONSEQUENCES</text><text x="100" y="175.0" font-family="Segoe UI" font-size="29" font-weight="700" fill="#7cddd8">CONTINUE THE PRACTICE</text><text x="100" y="302.0" font-family="Segoe UI" font-size="79" font-weight="700" fill="#f3f7f8">Choose one completed task.</text><text x="100" y="393.6" font-family="Segoe UI" font-size="79" font-weight="700" fill="#f3f7f8">Whose result is still open?</text><text x="100" y="574.0" font-family="Segoe UI" font-size="45" font-weight="400" fill="#b3c1ca">Describe the missing result and the evidence you would need.</text><text x="100" y="637.0" font-family="Segoe UI" font-size="45" font-weight="400" fill="#b3c1ca">Next: What do we actually know?</text><path d="M100 963 H1820" stroke="#2c3c49"/><path d="M100 963 H1820.0" stroke="#7cddd8" stroke-width="3"/><text x="100" y="1019.0" font-family="Segoe UI" font-size="23" font-weight="400" fill="#b3c1ca">ILLUSTRATIVE · FICTIONAL CASE A-W1</text><text x="1650" y="1019.0" font-family="Segoe UI" font-size="23" font-weight="400" fill="#b3c1ca">13 / 13</text></svg>